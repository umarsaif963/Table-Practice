<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background: #2a5298;
            color: #ffffff;
            padding: 12px 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tbody td {
            padding: 10px 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        tbody tr:hover {
            background: #f0f4ff;
        }

        tbody tr:nth-child(even) {
            background: #f8f9fc;
        }

        tbody tr:nth-child(even):hover {
            background: #e8eefb;
        }

        form {
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: #f4f6fb;
        }

        input {
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            flex: 1;
            min-width: 150px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.2);
        }

        button {
            margin: 0 auto;
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            background: #2a5298;
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1e3c72;
        }
    </style>
</head>
<body>
    <div class="container">
    <table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Roll No</th>
      <th>Email</th>
      <th>Phone</th>
      <th>Password</th>
    </tr>
  </thead>
  <tbody id="studentTableBody">
  </tbody>
</table>
<form style="margin-bottom:0;" onsubmit="addStudent(); return false;">
  <input type="text" id="name" placeholder="Name">
  <input type="number" id="roll" placeholder="Roll No">
  <input type="email" id="email" placeholder="Email">
  <input type="text" id="phone" placeholder="Phone">
  <input type="password" id="pass" placeholder="Password">
  <button type="submit">Submit</button>
</form>
</div>
<script src="script.js"></script>
</body>
</html>
